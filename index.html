        * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        body { font-family: sans-serif; background: #fdf2f8; height: 100vh; width: 100vw; overflow: hidden; }
        #cat-area, .scratch-canvas { touch-action: none; }
        button { touch-action: manipulation; cursor: pointer; }
        .shop-scroll { touch-action: pan-y !important; -webkit-overflow-scrolling: touch; }
        @keyframes p-frenzy { 0%,100%{box-shadow:inset 0 0 30px #ef4444} 50%{box-shadow:inset 0 0 60px #ef4444} }
        @keyframes p-golden { 0%,100%{box-shadow:inset 0 0 35px #eab308} 50%{box-shadow:inset 0 0 75px #facc15} }
        .mode-frenzy { animation: p-frenzy 0.35s infinite; border: 4px solid #ef4444 !important; }
        .mode-golden { animation: p-golden 0.75s infinite; border: 4px solid #eab308 !important; }
        @keyframes f-up { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-70px) scale(1.1)} }
        .float-text { position: absolute; pointer-events: none; animation: f-up 0.85s ease-out forwards; font-weight: 900; z-index: 50; }
        @keyframes r-anim { 0%,100%{transform:translate(0,0)} 50%{transform:translate(4px,-6px) rotate(6deg)} }
        .robot-anim { animation: r-anim 1.8s ease-in-out infinite; }
        @keyframes c-anim { 0%,100%{transform:scale(var(--cat-scale,0.4))} 50%{transform:scale(calc(var(--cat-scale,0.4)*0.94))} }
        .shake-target { animation: c-anim 0.08s ease-in-out; }
        .scratch-canvas { cursor: pointer; border-radius: 0.75rem; }
        @keyframes d-anim { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
        .dice-rolling { animation: d-anim 0.15s infinite linear; }
    </style>

                { id: 'scratchChance', name: 'これで億万長者？', sub: `券出現率: ${(getScratchRate() * 100).toFixed(1)}% (最大1.0%)`, cost: isMaxSc ? '最大' : `${formatNum(state.mCosts.scratchChance)} 🐾`, dis: isMaxSc || state.matatabi < state.mCosts.scratchChance, icon: 'fa-money-bill-trend-up', bg: 'bg-emerald-100/70', icbg: 'bg-emerald-500 text-white' },
                { id: 'scratchCap', name: 'わくわくの懐', sub: `券最大所持数: ${getMaxScratch()}個 (最大3個)`, cost: isMaxCap ? '最大' : `${formatNum(state.mCosts.scratchCap)} 🐾`, dis: isMaxCap || state.matatabi < state.mCosts.scratchCap, icon: 'fa-box-archive', bg: 'bg-yellow-100/70', icbg: 'bg-yellow-500 text-white' },
                { id: 'tapPower', name: 'タップ数増加', sub: `1タップ+${1 + state.tapPowerLevel * 5}回手入れ`, cost: `${formatNum(state.mCosts.tapPower)} 🐾`, dis: state.matatabi < state.mCosts.tapPower, icon: 'fa-hand-pointer', bg: 'bg-emerald-50', icbg: 'bg-emerald-300 text-emerald-900' },
                { id: 'golden', name: '黄金招き猫出現率', sub: `現在: ${(state.goldenChance * 100).toFixed(1)}%`, cost: `${formatNum(state.mCosts.golden)} 🐾`, dis: state.matatabi < state.mCosts.golden, icon: 'fa-crown', bg: 'bg-yellow-50', icbg: 'bg-yellow-300 text-yellow-900' },

                    </div>
                    <button onpointerdown="startHoldBuy('${it.id}', ${isMata})" onpointerleave="stopHoldBuy()" class="${isMata ? 'bg-purple-600 hover:bg-purple-700' : 'bg-pink-500 hover:bg-pink-600'} active:scale-95 text-white font-black text-xs px-2.5 py-1.5 rounded-lg shadow disabled:opacity-40 shrink-0 min-w-[76px] text-center" ${it.dis ? 'disabled' : ''}>

            document.getElementById('shop-normal-content').innerHTML = genHtml(normItems, false);

        function updateUI() {
            document.getElementById('money-display').innerText = formatNum(state.money);
            document.getElementById('matatabi-display').innerText = formatNum(state.matatabi);

        // 購入ロジック (成功時 true を返す)
        function handleBuy(id, isMata) {
            initAudio();
            let success = false;
            if (!isMata) {
                const c = state.costs[id];
                if (state.money >= c) {
                    state.money -= c;
                    if (id === 'size') { state.catSizeLevel++; state.costs.size = Math.floor(c * 2.2); }
                    else if (id === 'whiteRate') {
                        if (getWhiteChance() >= 99) return false;
                        state.whiteRateLevel++; state.costs.whiteRate = Math.floor(c * 2.0);
                    }
                    else if (id === 'whiteCombo') { state.whiteComboLevel++; state.costs.whiteCombo = Math.floor(c * 2.4); }
                    else if (id === 'critRate') { state.critRateLevel++; state.costs.critRate = Math.floor(c * 2.1); }
                    else if (id === 'critMult') { state.critMultLevel++; state.costs.critMult = Math.floor(c * 2.3); }
                    else if (id === 'karikari') { state.karikariLevel++; state.costs.karikari = Math.floor(c * 2.2); }
                    else if (id === 'robot') { state.robots++; state.costs.robot = Math.floor(c * 1.6); renderRobots(); }
                    else if (id === 'brown') { state.brownHairLevel++; state.costs.brown = Math.floor(c * 2.0); }
                    else if (id === 'black') { state.blackHairLevel++; state.costs.black = Math.floor(c * 2.5); }
                    success = true;
                }
            } else {
                const mc = state.mCosts[id];
                if (state.matatabi >= mc) {
                    state.matatabi -= mc;
                    if (id === 'target') { state.targetGroomBonusLevel++; state.mCosts.target = Math.floor(mc * 1.25) + 1; }
                    else if (id === 'swipeUnlock') { if (state.isSwipeUnlocked) return false; state.isSwipeUnlocked = true; }
                    else if (id === 'swipeSpeed') { state.swipeSpeedLevel++; state.mCosts.swipeSpeed = Math.floor(mc * 1.5) + 1; }
                    else if (id === 'hiddenFortune') { state.hiddenFortuneLevel++; state.mCosts.hiddenFortune = Math.floor(mc * 2.2); }
                    else if (id === 'ironCat') { state.ironCatLevel++; state.mCosts.ironCat = Math.floor(mc * 2.2); }
                    else if (id === 'nyankoro') { if (state.hasNyankoro) return false; state.hasNyankoro = true; }
                    else if (id === 'nyanchance') { if (state.hasNyanChance) return false; state.hasNyanChance = true; }
                    else if (id === 'scratchChance') {
                        if (getScratchRate() >= 0.01) return false;
                        state.scratchChanceLevel++; state.mCosts.scratchChance = Math.floor(mc * 2.0);
                    }
                    else if (id === 'scratchCap') {
                        if (getMaxScratch() >= 3) return false;
                        state.scratchCapLevel++; state.mCosts.scratchCap = 250;
                    }
                    else if (id === 'tapPower') { state.tapPowerLevel++; state.mCosts.tapPower = Math.floor(mc * 2.8); }
                    else if (id === 'golden') { state.goldenChanceLevel++; state.mCosts.golden = Math.floor(mc * 2.2); }
                    else if (id === 'frenzyRate') { state.frenzyChanceLevel++; state.mCosts.frenzyRate = Math.floor(mc * 2.2); }
                    else if (id === 'frenzyDur') { state.frenzyDurationLevel++; state.mCosts.frenzyDur = Math.floor(mc * 2.2); }
                    success = true;
                }
            }
            if (success) {
                playSound('buy'); // ちゃりん♪
                updateUI();
                saveGame();
            }
            return success;
        }

        // --- 長押しで連続購入ロジック ---
        let buyHoldTimer = null, buyHoldInterval = null;
        function startHoldBuy(id, isMata) {
            stopHoldBuy();
            const ok = handleBuy(id, isMata);
            if (!ok) return;

            // 380ms 押し続けたら連続購入開始
            buyHoldTimer = setTimeout(() => {
                buyHoldInterval = setInterval(() => {
                    const cont = handleBuy(id, isMata);
                    if (!cont) stopHoldBuy();
                }, 75); // 75ms毎にタタタッと購入
            }, 380);
        }

        function stopHoldBuy() {
            if (buyHoldTimer) { clearTimeout(buyHoldTimer); buyHoldTimer = null; }
            if (buyHoldInterval) { clearInterval(buyHoldInterval); buyHoldInterval = null; }
        }

        window.addEventListener('pointerup', stopHoldBuy);
        window.addEventListener('pointercancel', stopHoldBuy);

        function createFloat(x, y, text, cls) {
            const el = document.createElement('div'); el.className = `float-text ${cls}`; el.innerText = text;
            const r = document.getElementById('cat-area').getBoundingClientRect();
            x = (x || (r.left + r.width / 2)) + (Math.random() - 0.5) * 35;
            y = (y || (r.top + r.height / 2)) + (Math.random() - 0.5) * 20;
            el.style.left = `${x}px`; el.style.top = `${y - 20}px`;
            document.body.appendChild(el); setTimeout(() => el.remove(), 850);
        }

        function triggerFrenzy() {
            state.isFrenzyActive = true;
            state.frenzyTimeLeft = state.baseFrenzyDuration + state.frenzyDurationLevel * 2;
            document.getElementById('cat-area').classList.add('mode-frenzy');
            document.getElementById('frenzy-eyes').classList.remove('hidden');
            updateBuffBanner();
            if (state.frenzyTimer) clearInterval(state.frenzyTimer);
            state.frenzyTimer = setInterval(() => {
                state.frenzyTimeLeft--;
                if (state.frenzyTimeLeft <= 0) { stopFrenzy(); updateUI(); }
                else updateBuffBanner();
            }, 1000);
        }

        function performGroom(amount, px, py) {
            let total = 0, lastType = 'white', wChance = getWhiteChance() / 100;
            let base = getWhiteSinglePrice();

            for (let i = 0; i < amount; i++) {
                let r = Math.random();
                if (state.isGoldenCat) { total += base * 50; lastType = 'golden'; state.whiteComboCount = 0; }
                else {
                    let blk = (1 - wChance) * (0.2 + state.blackHairLevel * 0.1), brn = (1 - wChance) * (0.8 + state.brownHairLevel * 0.1);
                    if (r > wChance + brn) { total += base * getBlackMult(); lastType = 'black'; state.whiteComboCount = 0; }
                    else if (r > wChance) { total += base * getBrownMult(); lastType = 'brown'; state.whiteComboCount = 0; }
                    else {
                        state.whiteComboCount++;
                        total += base * (1 + state.whiteComboCount * state.whiteComboLevel * 0.05);
                        lastType = 'white';
                    }
                }
            }

            state.money += total;
            if (lastType === 'white' && state.whiteComboCount > 0) {
                document.getElementById('combo-count-text').innerText = `${state.whiteComboCount} COMBO`;
                playSound('white', state.whiteComboCount);
            } else {
                document.getElementById('combo-count-text').innerText = `0 COMBO`;
                playSound(lastType, 0);
            }
            let label = lastType === 'golden' ? '金色の毛! ' : (lastType === 'black' ? '黒い毛! ' : (lastType === 'brown' ? '茶色い毛! ' : (state.whiteComboCount > 1 ? `${state.whiteComboCount}コンボ! ` : '白い毛 ')));
            let col = lastType === 'golden' ? 'text-yellow-600 text-xl' : (lastType === 'black' ? 'text-purple-900 text-lg' : (lastType === 'brown' ? 'text-amber-800 text-md' : (state.whiteComboCount > 1 ? 'text-amber-600 text-md' : 'text-slate-600')));
            createFloat(px, py, `${label}+${formatNum(total)}円`, col);

            state.strokeCount += amount;
            if (state.strokeCount >= state.targetStrokes) { state.strokeCount = 0; triggerRebirthModal(); }
            checkGameClear();
        }

        // 独立した1アクションごとの抽選
        function triggerActionChances(px, py) {
            if (state.scratchTickets < getMaxScratch() && Math.random() < getScratchRate()) {
                state.scratchTickets++;
                createFloat(px, py, "🎟️ スクラッチ券GET!", "text-amber-500 text-sm font-black");
            }
            const frenzyChance = state.baseFrenzyChance + state.frenzyChanceLevel * 0.001;
            if (!state.isFrenzyActive && Math.random() < frenzyChance) {
                triggerFrenzy();
            }
        }

        let nyankoroDone = false, nyanChanceUsed = false;
        function updateModalVals() {
            let earn = Math.max(1, Math.floor(Math.sqrt(state.money / 100)));
            document.getElementById('modal-money-display').innerText = `${formatNum(state.money)} 円`;

                if (state.hasNyanChance) document.getElementById('nyanchance-badge').classList.remove('hidden');
                else document.getElementById('nyanchance-badge').classList.add('hidden');

            document.getElementById('modal-overlay').classList.remove('hidden');

        document.getElementById('btn-roll-dice').addEventListener('click', () => {
            if (nyankoroDone) return;
            const btn = document.getElementById('btn-roll-dice'), dsp = document.getElementById('dice-display'), msg = document.getElementById('dice-result-msg');
            btn.disabled = true; btn.className = 'bg-slate-400 text-white font-black text-xs px-3.5 py-2 rounded-xl shadow opacity-60 cursor-not-allowed';
            dsp.classList.add('dice-rolling');

            setTimeout(() => {
                clearInterval(iv); dsp.classList.remove('dice-rolling');
                const roll = Math.floor(Math.random() * 6) + 1; dsp.innerText = roll;
                if (roll % 2 !== 0) {
                    nyankoroDone = true; state.money *= 3;
                    msg.innerHTML = `<span class="text-emerald-600">奇数 (${roll})！ 所持金が3倍になった！🎉</span>`;
                    playSound('dice-win');
                    checkGameClear();
                } else {
                    if (state.hasNyanChance && !nyanChanceUsed) {
                        nyanChanceUsed = true;
                        msg.innerHTML = `<span class="text-rose-500">偶数 (${roll})…だがニャンチャンス発動！もう1回振れる！🍀</span>`;
                        playSound('dice-lose');
                        btn.disabled = false; btn.innerText = 'もう一度振る！';
                        btn.className = 'bg-rose-500 hover:bg-rose-600 active:scale-95 text-white font-black text-xs px-3.5 py-2 rounded-xl shadow animate-pulse';
                    } else {
                        nyankoroDone = true; state.money = 0;
                        msg.innerHTML = `<span class="text-rose-600">偶数 (${roll})！ 残念…所持金が0円になりました💀</span>`;
                        playSound('dice-lose');
                    }
                }
                updateModalVals(); updateUI();
            }, 1000);
        });

        document.getElementById('modal-close').addEventListener('click', () => {
            stopFrenzy();
            state.matatabi += Math.max(1, Math.floor(Math.sqrt(state.money / 100)));
            state.rebirthCount++;
            const addBonus = Math.floor(state.targetStrokes / 100);
            state.rebirthBonusPrice += addBonus;
            state.money = getStartMoney();

            let nextPattern = Math.floor(Math.random() * 10);
            if (nextPattern === state.catPatternIndex) nextPattern = (nextPattern + 1) % 10;
            state.catPatternIndex = nextPattern;
            applyCalicoPattern(state.catPatternIndex);

            state.catSizeLevel = 0; state.whiteRateLevel = 0; state.whiteComboLevel = 0; state.robots = 0;
            state.brownHairLevel = 0; state.blackHairLevel = 0; state.critRateLevel = 0; state.critMultLevel = 0; state.karikariLevel = 0;
            state.whiteComboCount = 0; state.scratchTickets = 0;
            state.costs = { size: 10, whiteRate: 30, whiteCombo: 150, critRate: 100, critMult: 250, karikari: 300, robot: 50, brown: 80, black: 200 };
            renderRobots();
            document.getElementById('modal-overlay').classList.add('hidden');
            isRebirthModalOpen = false;
            saveGame(); updateUI();
        });

        function renderRobots() {
            const cont = document.getElementById('robot-container'); cont.innerHTML = '';
            for (let i = 0; i < Math.min(state.robots, 12); i++) {
                const ang = (i / Math.min(state.robots, 12)) * Math.PI * 2;
                const d = document.createElement('div');
                d.className = 'absolute robot-anim text-blue-500 text-lg md:text-2xl drop-shadow-md';
                d.style.left = `${50 + Math.cos(ang) * 38}%`; d.style.top = `${50 + Math.sin(ang) * 32}%`;
                d.style.animationDelay = `${i * 0.18}s`; d.innerHTML = `<i class="fa-solid fa-cat"></i>`;
                cont.appendChild(d);
            }
        }

        // タップ & スワイプ操作
        let isPointerDown = false, lastX = 0, lastY = 0, lastSwipeT = 0;
        const catArea = document.getElementById('cat-area');
        catArea.addEventListener('pointerdown', (e) => {
            initAudio(); isPointerDown = true; lastX = e.clientX; lastY = e.clientY;
            let tapAmt = (1 + state.tapPowerLevel * 5) * (state.isFrenzyActive ? 2 : 1);

            if (Math.random() < 0.01) {
                playCatMeow();
                createFloat(e.clientX, e.clientY - 45, "にゃ〜ん🐾", "text-pink-600 text-lg font-black animate-pulse");
            }

            if (Math.random() * 100 < getCritRate()) {
                tapAmt = Math.max(1, Math.floor(tapAmt * getCritMult()));
                playSound('crit', state.whiteComboCount);
                createFloat(e.clientX, e.clientY - 25, `💥 CRITICAL!! x${getCritMult().toFixed(1)}`, "text-red-500 text-lg font-black animate-bounce");
            }

            performGroom(tapAmt, e.clientX, e.clientY);
            triggerActionChances(e.clientX, e.clientY);

            const w = document.getElementById('cat-wrapper');
            w.classList.remove('shake-target'); void w.offsetWidth; w.classList.add('shake-target');
            updateUI();
        });

        window.addEventListener('pointermove', (e) => {
            if (!isPointerDown || !state.isSwipeUnlocked) return;
            const now = Date.now(), dist = Math.hypot(e.clientX - lastX, e.clientY - lastY);
            if (dist > 25 && (now - lastSwipeT >= getSwipeInterval())) {
                lastSwipeT = now; lastX = e.clientX; lastY = e.clientY;
                let swipeAmt = Math.max(1, Math.floor(0.25 + state.swipeSpeedLevel * 1.2)) * (state.isFrenzyActive ? 2 : 1);
                if (Math.random() * 100 < getCritRate()) {
                    swipeAmt = Math.max(1, Math.floor(swipeAmt * getCritMult()));
                    playSound('crit', state.whiteComboCount);
                }
                performGroom(swipeAmt, e.clientX, e.clientY);
                triggerActionChances(e.clientX, e.clientY);

                const w = document.getElementById('cat-wrapper');
                w.classList.remove('shake-target'); void w.offsetWidth; w.classList.add('shake-target');
                updateUI();

        });
        window.addEventListener('pointerup', () => { isPointerDown = false; });
        window.addEventListener('pointercancel', () => { isPointerDown = false; });

        // スクラッチ
        document.getElementById('scratch-ticket-btn').addEventListener('click', () => {
            if (state.scratchTickets <= 0) return;
            isScratchModalOpen = true;
            scratchState.isFinished = false; scratchState.scratched = [false, false, false];
            scratchState.startedScratching = false;
            document.getElementById('scratch-modal-close').classList.remove('hidden');
            document.getElementById('scratch-result-msg').innerText = '';

            const r = Math.random();
            if (r < 0.05) scratchState.symbols = ['💎','💎','💎'];
            else if (r < 0.40) scratchState.symbols = ['🐱','🐱','🐱'];
            else scratchState.symbols = [['🐱','🐱','🐟'],['🐱','🐟','🐱'],['🐟','🐱','🐱'],['🐱','🐟','🐟'],['🐱','💎','🐟'],['💎','🐱','🐱']][Math.floor(Math.random() * 6)];

            for (let i = 0; i < 3; i++) {
                document.getElementById(`scratch-symbol-${i}`).innerText = scratchState.symbols[i];
                initScratch(i);
            }
            document.getElementById('scratch-modal-overlay').classList.remove('hidden');
        });

        function initScratch(idx) {
            const cvs = document.getElementById(`scratch-canvas-${idx}`), ctx = cvs.getContext('2d');
            scratchState.canvases[idx] = cvs; scratchState.ctxs[idx] = ctx;
            ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#cbd5e1'; ctx.fillRect(0, 0, cvs.width, cvs.height);
            ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('こすってね', cvs.width / 2, cvs.height / 2 + 4);
            let scratching = false;
            const scratchAt = (cx, cy) => {
                if (!scratchState.startedScratching) {
                    scratchState.startedScratching = true;
                    document.getElementById('scratch-modal-close').classList.add('hidden');
                }
                const r = cvs.getBoundingClientRect();
                const x = (cx - r.left) * (cvs.width / r.width), y = (cy - r.top) * (cvs.height / r.height);
                ctx.globalCompositeOperation = 'destination-out'; ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.fill();
                checkScratch(idx);
            };
            cvs.onpointerdown = (e) => { scratching = true; scratchAt(e.clientX, e.clientY); };
            cvs.onpointermove = (e) => { if (scratching) scratchAt(e.clientX, e.clientY); };
            window.addEventListener('pointerup', () => { scratching = false; });
        }

        function checkScratch(idx) {
            if (scratchState.scratched[idx]) return;
            const cvs = scratchState.canvases[idx], ctx = scratchState.ctxs[idx];
            const d = ctx.getImageData(0, 0, cvs.width, cvs.height).data;
            let clear = 0; for (let i = 3; i < d.length; i += 4) if (d[i] === 0) clear++;
            if (clear / (cvs.width * cvs.height) > 0.45) {
                scratchState.scratched[idx] = true; ctx.clearRect(0, 0, cvs.width, cvs.height);
                const sym = scratchState.symbols[idx];
                playSound(sym === '🐱' || sym === '💎' ? 'scratch-hit' : 'scratch-miss');

                if (scratchState.scratched.every(v => v) && !scratchState.isFinished) {
                    scratchState.isFinished = true; state.scratchTickets--;
                    document.getElementById('scratch-modal-close').classList.remove('hidden');

                    const isAllDia = scratchState.symbols.every(s => s === '💎');
                    const isAllCat = scratchState.symbols.every(s => s === '🐱');
                    const msg = document.getElementById('scratch-result-msg');
                    const whitePrice = getWhiteSinglePrice();

                    if (isAllDia) {
                        const winMoney = whitePrice * 10000;
                        state.money += winMoney;
                        msg.innerHTML = `<span class="text-cyan-500 font-black animate-bounce inline-block text-sm">💎 超大当たり！ +${formatNum(winMoney)}円！！ (白毛1万本分) 💎</span>`;
                        playSound('scratch-jackpot'); launchConfetti();
                        checkGameClear();
                    } else if (isAllCat) {
                        const winMoney = whitePrice * 2000;
                        state.money += winMoney;
                        msg.innerHTML = `<span class="text-red-600 font-black animate-bounce inline-block">🎉 大当り！ +${formatNum(winMoney)}円！ (白毛2000本分) 🎉</span>`;
                        playSound('scratch-jackpot'); launchConfetti();
                        checkGameClear();
                    } else {
                        msg.innerHTML = `<span class="text-slate-500 font-bold">残念！はずれニャ…</span>`;
                    }
                    updateUI(); saveGame();
                }
            }
        }
        document.getElementById('scratch-modal-close').addEventListener('click', () => {
            document.getElementById('scratch-modal-overlay').classList.add('hidden');
            isScratchModalOpen = false;
        });

        // タブ切替
        document.getElementById('tab-normal').addEventListener('click', () => {
            document.getElementById('tab-normal').className = "flex-1 py-2 text-xs font-black text-pink-900 border-b-2 border-pink-500 bg-white flex items-center justify-center gap-1.5";
            document.getElementById('tab-matatabi').className = "flex-1 py-2 text-xs font-black text-slate-500 border-b-2 border-transparent bg-transparent flex items-center justify-center gap-1.5";
            document.getElementById('shop-normal-content').classList.remove('hidden'); document.getElementById('shop-matatabi-content').classList.add('hidden');
        });
        document.getElementById('tab-matatabi').addEventListener('click', () => {
            document.getElementById('tab-matatabi').className = "flex-1 py-2 text-xs font-black text-purple-900 border-b-2 border-purple-500 bg-purple-50 flex items-center justify-center gap-1.5";
            document.getElementById('tab-normal').className = "flex-1 py-2 text-xs font-black text-slate-500 border-b-2 border-transparent bg-transparent flex items-center justify-center gap-1.5";
            document.getElementById('shop-matatabi-content').classList.remove('hidden'); document.getElementById('shop-normal-content').classList.add('hidden');
        });

        document.getElementById('sound-toggle').onclick = () => { initAudio(); state.soundEnabled = !state.soundEnabled; updateUI(); saveGame(); };
        window.addEventListener('beforeunload', saveGame);

        // ループ
        let loopCnt = 0;
        setInterval(() => {
            if (state.robots > 0 && !isRebirthModalOpen && !isScratchModalOpen) {
                const rMult = (1 + state.ironCatLevel);
                performGroom(state.robots * rMult, null, null);
                triggerActionChances(null, null);
            }
            updateUI();
            loopCnt++; if (loopCnt % 30 === 0) saveGame();
        }, 1000);

        // 初回起動
        loadGame();
        applyCalicoPattern(state.catPatternIndex);
        renderRobots();
        updateUI();
    </script>
</body>
</html>
